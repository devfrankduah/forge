[project]
name = "forge"
version = "0.1.0"
description = "LoRA fine-tuning from scratch in NumPy, with hand-written gradient-checked backprop, adapting a frozen Glassbox transformer."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["forge*"]
